# Deploy the backend to Render: render.com -> New -> Blueprint -> point at this repo.
# Fill in real values for the marked env vars in the Render dashboard after creation
# (never commit real secrets into this file).
services:
  - type: web
    name: nexus-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # set manually in the dashboard — see backend/scripts/generate_secrets.py
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: RAG_UPLOAD_DIR
        value: /data/rag_uploads  # mount a Render persistent disk at /data
      - key: RAG_MAX_FILE_MB
        value: "50"

databases:
  - name: nexus-ai-db
    plan: starter
